<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://back.eavtotalim.uz; connect-src 'self' https://savt-ai.sulaymonov1s.workers.dev https://back.eavtotalim.uz; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<title>SAVT — Тесты</title>
<link rel="preload" href="logo.png" as="image">
<link rel="prefetch" href="data_uz.js" as="script">
<style>
:root{
  --bg:#0b0d12;
  --glass:rgba(30,34,44,.55);
  --glass2:rgba(255,255,255,.08);
  --stroke:rgba(255,255,255,.16);
  --stroke2:rgba(255,255,255,.34);
  --text:#f5f5f7; --muted:#a1a1aa; --muted2:#6b7280;
  --accent:#8ab4f8; --accent2:#aecbfa;
  --good:#81c995; --bad:#f28b82; --warn:#fdd663;
  --gyellow:#fbbc05;
  --r:24px;
}
body.day{
  --bg:#f2f2f7;
  --glass:rgba(255,255,255,.62);
  --glass2:rgba(255,255,255,.55);
  --stroke:rgba(0,0,0,.08);
  --stroke2:rgba(0,0,0,.16);
  --text:#1c1c1e; --muted:#6e6e73; --muted2:#8e8e93;
  --accent:#0a84ff; --accent2:#409cff;
  --good:#248a3d; --bad:#d70015; --warn:#a05a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background .4s ease, color .4s ease;
}
/* ============================================================
   AURORA BACKGROUND (по мотивам Aceternity UI) + DOT PATTERN (Magic UI).
   Чистый CSS вместо Three.js: -592 КБ, без WebGL-контекста и без
   перерисовки каждый кадр. Анимируются только transform/opacity —
   их считает композитор GPU, поэтому лейаут не пересчитывается.
   ============================================================ */
#aurora{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;
  transition:opacity .5s ease;contain:strict}
#aurora .beam{
  position:absolute;border-radius:50%;
  filter:blur(70px);opacity:.5;
  will-change:transform;
  animation:auroraDrift 26s ease-in-out infinite alternate;
}
/* три градиентных пятна фирменных цветов: синий → зелёный → фиолетовый */
#aurora .b1{width:60vw;height:60vw;min-width:420px;min-height:420px;top:-18vh;left:-8vw;
  background:radial-gradient(circle at 30% 30%, rgba(66,133,244,.55), rgba(66,133,244,0) 70%);
  animation-duration:28s}
#aurora .b2{width:52vw;height:52vw;min-width:380px;min-height:380px;top:22vh;right:-12vw;
  background:radial-gradient(circle at 60% 40%, rgba(52,168,83,.42), rgba(52,168,83,0) 70%);
  animation-duration:34s;animation-delay:-8s}
#aurora .b3{width:46vw;height:46vw;min-width:340px;min-height:340px;bottom:-16vh;left:18vw;
  background:radial-gradient(circle at 50% 50%, rgba(138,99,248,.38), rgba(138,99,248,0) 70%);
  animation-duration:31s;animation-delay:-15s}
@keyframes auroraDrift{
  0%  {transform:translate3d(0,0,0) scale(1)}
  50% {transform:translate3d(4vw,3vh,0) scale(1.12)}
  100%{transform:translate3d(-3vw,5vh,0) scale(.94)}
}
body.day #aurora .beam{opacity:.34;filter:blur(80px)}
body.day #aurora .b1{background:radial-gradient(circle at 30% 30%, rgba(10,132,255,.42), rgba(10,132,255,0) 70%)}
body.day #aurora .b2{background:radial-gradient(circle at 60% 40%, rgba(52,199,89,.34), rgba(52,199,89,0) 70%)}
body.day #aurora .b3{background:radial-gradient(circle at 50% 50%, rgba(175,82,222,.3), rgba(175,82,222,0) 70%)}

/* Dot Pattern — точечная сетка поверх ауроры, с мягким виньетированием */
#dotgrid{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:radial-gradient(circle, rgba(255,255,255,.16) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(ellipse 80% 65% at 50% 35%, #000 35%, transparent 78%);
  mask-image:radial-gradient(ellipse 80% 65% at 50% 35%, #000 35%, transparent 78%);
  opacity:.55;transition:opacity .4s ease;
}
body.day #dotgrid{background-image:radial-gradient(circle, rgba(0,0,0,.14) 1px, transparent 1px);opacity:.5}

/* в режиме теста фон приглушается, чтобы не мешать чтению вопросов */
body.focus-mode #aurora{opacity:.32}
body.focus-mode #dotgrid{opacity:.2}
body.focus-mode #bgfade{opacity:.9}

/* аварийный/эконом-режим: статичный фон без анимации */
body.no3d #aurora .beam{animation:none}
#bgfade{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg);opacity:.22;transition:opacity .4s ease}

/* уважение к системной настройке «меньше движения» */
@media (prefers-reduced-motion: reduce){
  #aurora .beam{animation:none}
}

/* Ширина: обычные экраны — читаемая колонка, экран теста — во всю ширину
   (full-screen стиль). Переключает класс body.exam-mode. */
#app{
  width:100%;max-width:1080px;margin:0 auto;
  padding:28px 24px calc(120px + env(safe-area-inset-bottom));
  transition:transform .38s cubic-bezier(.3,1,.3,1),opacity .38s ease,max-width .3s ease;
}
body.exam-mode #app{max-width:1720px;padding-left:32px;padding-right:32px}
@media(min-width:1900px){ body.exam-mode #app{max-width:1860px} }
#app.pt-in{transform:translateX(-46px) scale(.98);opacity:0}
#app.pt-out{transform:translateX(46px) scale(.98);opacity:0}

.logo{
  width:46px;height:46px;border-radius:50%;flex:0 0 46px;
  background:#0a0b0d;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 10px 28px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.4);
}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}


.glass{
  background:var(--glass);
  border:1px solid var(--stroke);
  border-radius:var(--r);
  backdrop-filter:blur(36px) saturate(190%);
  -webkit-backdrop-filter:blur(36px) saturate(190%);
  box-shadow:0 20px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
  position:relative;
}
.glass.soft{box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
body.day .glass{box-shadow:0 12px 34px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.8)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:999px;
  border:1px solid var(--stroke);
  background:var(--glass2);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  color:var(--text);font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
  user-select:none;
}
.btn:hover{border-color:var(--stroke2);background:rgba(128,128,128,.18);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{
  background:linear-gradient(145deg,#0a84ff,#409cff);border:none;color:#fff;
  box-shadow:0 8px 24px rgba(10,132,255,.4), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn.primary:hover{filter:brightness(1.1)}
.btn.good{
  background:linear-gradient(145deg,#28a745,#34c759);border:none;color:#fff;
  box-shadow:0 8px 24px rgba(52,199,89,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:16px;font-size:16px;font-weight:700;letter-spacing:-.01em}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}

/* hamburger + side menu */
.burger{
  width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:var(--glass2);border:1px solid var(--stroke);cursor:pointer;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex:0 0 44px;
}
.burger span,.burger span::before,.burger span::after{
  content:'';display:block;width:18px;height:2px;background:var(--text);border-radius:2px;position:relative;transition:.25s;
}
.burger span::before{position:absolute;top:-6px}
.burger span::after{position:absolute;top:6px}
.burger.open span{background:transparent}
.burger.open span::before{transform:rotate(45deg);top:0}
.burger.open span::after{transform:rotate(-45deg);top:0}

.sidemenu{
  position:fixed;top:0;left:0;bottom:0;width:300px;max-width:84vw;z-index:50;
  background:var(--glass);backdrop-filter:blur(44px) saturate(200%);-webkit-backdrop-filter:blur(44px) saturate(200%);
  border-right:1px solid var(--stroke);border-radius:0 28px 28px 0;
  padding:26px 22px;transform:translateX(-105%);transition:transform .35s cubic-bezier(.3,1,.3,1);
  box-shadow:20px 0 60px rgba(0,0,0,.3);overflow-y:auto;
}
.sidemenu.open{transform:translateX(0)}
.sidemenu h3{font-size:13px;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.sidemenu h3:first-child{margin-top:0}
.mitem{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 14px;border-radius:14px;border:1px solid transparent;background:transparent;
  color:var(--text);font-weight:600;font-size:14.5px;cursor:pointer;transition:.15s;font-family:inherit;
}
.mitem:hover{background:var(--glass2);border-color:var(--stroke)}
.mitem .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--glass2);font-size:15px;flex:0 0 30px}
.scfade{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.scfade.on{opacity:1;pointer-events:auto}

/* ============================================================
   FLOATING GLASS DOCK (21st.dev / Shadcn) — плавающий хедер
   ============================================================ */
header{
  position:sticky;top:12px;z-index:30;
  display:flex;align-items:center;gap:14px;margin-bottom:26px;
  padding:10px 14px;border-radius:22px;
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);
  box-shadow:0 12px 36px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.14);
  transition:box-shadow .3s ease, border-color .3s ease;
}
body.day header{box-shadow:0 10px 30px rgba(0,0,0,.09), inset 0 1px 0 rgba(255,255,255,.85)}
header.scrolled{box-shadow:0 16px 44px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.16);border-color:var(--stroke2)}
body.day header.scrolled{box-shadow:0 14px 38px rgba(0,0,0,.13), inset 0 1px 0 rgba(255,255,255,.9)}

/* индикатор офлайн-готовности */
.offline-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;margin-top:4px;
  background:rgba(52,199,89,.14);border:1px solid rgba(52,199,89,.4);
  color:var(--good);font-size:11px;font-weight:700;letter-spacing:.02em;
  white-space:nowrap;
}
.offline-pill .led{
  width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px;
  box-shadow:0 0 0 0 currentColor;animation:ledPulse 2.6s ease-out infinite;
}
@keyframes ledPulse{
  0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}
  70%{box-shadow:0 0 0 6px rgba(52,199,89,0)}
  100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}
}
.headmeta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}

/* ============================================================
   GLASS SEGMENTED CONTROL — переключатель языка со скользящим
   индикатором (аналог Shadcn/21st.dev, на чистом CSS)
   ============================================================ */
.langsw{
  margin-left:auto;flex:0 0 auto;position:relative;display:flex;gap:0;
  background:rgba(128,128,128,.16);border-radius:14px;padding:3px;
  border:1px solid var(--stroke);
}
.langsw .slider{
  position:absolute;top:3px;left:3px;height:calc(100% - 6px);
  border-radius:11px;background:var(--glass);
  border:1px solid var(--stroke2);
  box-shadow:0 4px 14px rgba(0,0,0,.28);
  transition:transform .34s cubic-bezier(.34,1.36,.44,1), width .34s cubic-bezier(.34,1.36,.44,1);
  pointer-events:none;z-index:0;
}
body.day .langsw .slider{background:rgba(255,255,255,.94);box-shadow:0 3px 10px rgba(0,0,0,.14)}
.langsw button{
  position:relative;z-index:1;
  border:none;background:transparent;color:var(--muted);
  font:700 12px/1 inherit;letter-spacing:.03em;
  padding:7px 13px;border-radius:11px;cursor:pointer;
  transition:color .25s ease;
}
.langsw button.on{color:var(--text)}
.langsw button:hover:not(.on){color:var(--text);opacity:.75}

/* ============================================================
   GLASS CONTROL DOCK — панель режимов со скользящим ховером
   ============================================================ */
/* СТРОГО один ряд на всех экранах: без wrap и без сетки 2x2.
   На узких экранах — аккуратная горизонтальная прокрутка без видимой полосы. */
.modedock{
  position:relative;display:flex;gap:4px;
  flex-wrap:nowrap;flex-direction:row;
  padding:5px;border-radius:18px;
  background:rgba(128,128,128,.14);
  border:1px solid var(--stroke);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  max-width:100%;
}
.modedock::-webkit-scrollbar{display:none}
.modedock .glide{
  position:absolute;top:5px;left:0;height:calc(100% - 10px);
  border-radius:13px;background:var(--glass2);
  border:1px solid var(--stroke);
  opacity:0;transform:scale(.96);
  transition:transform .34s cubic-bezier(.34,1.3,.44,1), width .34s cubic-bezier(.34,1.3,.44,1), opacity .22s ease;
  pointer-events:none;z-index:0;
}
.modedock:hover .glide{opacity:1;transform:scale(1)}
.modebtn{
  position:relative;z-index:1;flex:0 0 auto;
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 16px;border-radius:13px;
  border:1px solid transparent;background:transparent;
  color:var(--text);font:600 13.5px/1 inherit;cursor:pointer;
  transition:color .2s ease, transform .16s ease, opacity .2s ease;
  white-space:nowrap;font-family:inherit;
}
.modebtn:active{transform:scale(.96)}
.modebtn:disabled{opacity:.36;cursor:not-allowed}
.modebtn .mi{font-size:14px;line-height:1;display:inline-flex}
.modebtn .mshort{display:none}
.modebtn .cnt{
  font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;
  background:var(--glass2);border:1px solid var(--stroke);
  font-variant-numeric:tabular-nums;line-height:1.4;
}
.modebtn.accent .cnt{background:rgba(138,180,248,.2);border-color:rgba(138,180,248,.45);color:var(--accent)}
.modebtn.good .cnt{background:rgba(52,199,89,.2);border-color:rgba(52,199,89,.45);color:var(--good)}
.modebtn.warn{color:var(--warn)}
.modebtn.danger{color:var(--bad);opacity:.85}
.modebtn.danger:hover{opacity:1}

/* шапка дорожной карты */
/* Заголовок слева от плашки на ПК, над плашкой — на мобильных */
.roadhead-top{
  display:flex;flex-direction:column;align-items:stretch;gap:14px;
}
.roadhead-top>div:first-child{min-width:0}
@media(min-width:768px){
  .roadhead-top{flex-direction:row;align-items:center;justify-content:space-between;gap:18px}
  .roadhead-top .modedock{flex:0 1 auto}
}

/* ============================================================
   ROADMAP — интерактивный граф этапов.
   ANIMATED BEAM (Magic UI): по линии-связи бежит световой импульс,
   пройденный участок трассы заливается градиентом (stroke-dashoffset).
   BORDER BEAM (Aceternity): у карточек 100% по границе вращается луч.
   ============================================================ */
.roadmap{position:relative;padding:10px 0}
.roadmap svg.track{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.node .body{z-index:1}
.node .dot{z-index:2}
/* серая «непройденная» трасса */
.roadmap svg.track path.base{
  fill:none;stroke:rgba(138,180,248,.22);stroke-width:2.5;
  stroke-linecap:round;stroke-dasharray:.5 9;
}
body.day .roadmap svg.track path.base{stroke:rgba(10,132,255,.3)}
/* пройденный участок — сплошной градиент */
.roadmap svg.track path.progress{
  fill:none;stroke:url(#trackGrad);stroke-width:3.5;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(52,199,89,.5));
  transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1);
}
/* бегущий импульс (Animated Beam) */
.roadmap svg.track path.beam{
  fill:none;stroke:url(#beamGrad);stroke-width:3.5;stroke-linecap:round;
  filter:drop-shadow(0 0 8px rgba(138,180,248,.85));
  animation:beamRun 5.5s linear infinite;
}
@keyframes beamRun{
  from{stroke-dashoffset:var(--beam-len)}
  to{stroke-dashoffset:calc(var(--beam-len) * -1)}
}
@media (prefers-reduced-motion: reduce){ .roadmap svg.track path.beam{display:none} }

.node{position:relative;z-index:1;display:flex;margin:7px 0}
.node .cardwrap{display:flex;align-items:center;gap:14px;width:min(440px,86%)}
.node:nth-child(even) .cardwrap{margin-left:auto;flex-direction:row-reverse;text-align:right}

/* узел-маркер */
.node .dot{
  position:relative;
  width:46px;height:46px;border-radius:50%;flex:0 0 46px;
  display:grid;place-items:center;font-weight:800;font-size:15px;
  background:var(--glass2);border:2px solid var(--stroke2);color:var(--muted);
  backdrop-filter:blur(14px);
  box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .28s cubic-bezier(.34,1.4,.44,1), box-shadow .28s ease, border-color .28s ease;
}
.node.done .dot{
  background:linear-gradient(145deg,#28a745,#34c759);border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(52,199,89,.45), inset 0 1px 0 rgba(255,255,255,.3);
}
/* пульсирующее свечение пройденного узла */
.node.done .dot::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:2px solid rgba(52,199,89,.55);
  animation:nodeHalo 2.8s ease-out infinite;pointer-events:none;
}
@keyframes nodeHalo{
  0%{transform:scale(1);opacity:.75}
  70%{transform:scale(1.4);opacity:0}
  100%{transform:scale(1.4);opacity:0}
}
.node.fail .dot{
  background:linear-gradient(145deg,#d33426,#ff453a);border-color:transparent;color:#fff;
  box-shadow:0 6px 20px rgba(255,69,58,.38);
}
/* текущий (следующий к прохождению) узел */
.node.current .dot{
  border-color:var(--gyellow);color:var(--gyellow);
  box-shadow:0 6px 22px rgba(251,188,5,.4), inset 0 1px 0 rgba(255,255,255,.2);
}
.node.current .dot::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:2px solid rgba(251,188,5,.6);
  animation:nodeHalo 2.4s ease-out infinite;pointer-events:none;
}
.node .cardwrap:hover .dot{transform:scale(1.1)}

/* карточка этапа */
.node .body{
  position:relative;flex:1;padding:14px 17px;cursor:pointer;overflow:hidden;
  transition:transform .22s cubic-bezier(.34,1.3,.44,1), border-color .22s ease, box-shadow .22s ease;
}
.node .body:hover{
  transform:translateY(-2px) scale(1.015);
  border-color:var(--stroke2);
  box-shadow:0 14px 34px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.16);
}
body.day .node .body:hover{box-shadow:0 12px 28px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.9)}
.node .body:active{transform:translateY(0) scale(.995)}

/* BORDER BEAM — вращающийся луч по рамке пройденной на 100% карточки */
.node.perfect .body::before{
  content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;
  background:conic-gradient(from var(--beam-angle,0deg),
    transparent 0deg, transparent 300deg,
    rgba(52,199,89,.9) 340deg, rgba(160,255,190,1) 355deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:borderBeam 4.5s linear infinite;pointer-events:none;
}
@property --beam-angle{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes borderBeam{to{--beam-angle:360deg}}
/* фолбэк для браузеров без @property: мягкое зелёное свечение рамки */
@supports not (background: conic-gradient(from var(--x,0deg), red, blue)){
  .node.perfect .body::before{display:none}
  .node.perfect .body{border-color:rgba(52,199,89,.6);box-shadow:0 0 22px rgba(52,199,89,.22)}
}
@media (prefers-reduced-motion: reduce){
  .node.perfect .body::before{animation:none}
}
.node.done .body{border-color:rgba(52,199,89,.35)}
.node.fail .body{border-color:rgba(255,69,58,.3)}

.node .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.node:nth-child(even) .nm{flex-direction:row-reverse}
.node .meta{color:var(--muted);font-size:12px;margin-top:3px}

/* мини-прогрессбар внутри карточки */
.node .pbar{
  height:4px;border-radius:99px;background:rgba(128,128,128,.22);
  overflow:hidden;margin-top:9px;
}
.node .pbar>i{
  display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#4285f4,#34c759);
  transform-origin:left;transition:width .8s cubic-bezier(.4,0,.2,1);
}
.node.fail .pbar>i{background:linear-gradient(90deg,#ff9f0a,#ff453a)}

/* floating badge с процентом */
.pctbadge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  border:1px solid var(--stroke);background:var(--glass2);color:var(--muted);
  backdrop-filter:blur(10px);
}
.pctbadge.good{
  color:var(--good);border-color:rgba(52,199,89,.5);
  background:rgba(52,199,89,.14);box-shadow:0 0 14px rgba(52,199,89,.2);
}
.pctbadge.bad{color:var(--bad);border-color:rgba(255,69,58,.45);background:rgba(255,69,58,.12)}
.lockic{opacity:.5;font-size:13px}

.chip{
  background:var(--glass2);border:1px solid var(--stroke);border-radius:999px;
  padding:4px 11px;color:var(--muted);font-size:12px;white-space:nowrap;
  backdrop-filter:blur(10px);font-variant-numeric:tabular-nums;
}
.chip.good{color:var(--good);border-color:rgba(52,199,89,.45)}
.chip.bad{color:var(--bad);border-color:rgba(255,69,58,.45)}

/* setup */
.setup{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media(max-width:720px){.setup{grid-template-columns:1fr}}
.panel{padding:24px}
.statbig{display:inline-block;padding:14px 24px;border-radius:16px;background:rgba(52,199,89,.12);border:1px solid rgba(52,199,89,.35)}
.statbig .n{font-size:32px;font-weight:800;color:var(--good);letter-spacing:-.03em}
.statbig .l{font-size:12px;color:var(--muted)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--stroke)}
.setrow:last-of-type{border-bottom:none}
.setrow .t{font-weight:600}
.setrow .d{color:var(--muted);font-size:12px;margin-top:2px}
.switch{position:relative;width:50px;height:29px;flex:0 0 50px;cursor:pointer}
.switch input{display:none}
.switch .tr{position:absolute;inset:0;border-radius:99px;transition:.22s;background:rgba(128,128,128,.25);border:1px solid var(--stroke)}
.switch .th{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.22s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.switch input:checked + .tr{background:linear-gradient(145deg,#28a745,#34c759);border-color:transparent}
.switch input:checked + .tr + .th{left:24px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px}
input[type=number]{
  width:90px;padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
  background:var(--glass2);color:var(--text);font-size:15px;font-weight:700;text-align:center;font-family:inherit;
}

/* ============================================================
   EXAM — шапка теста и двухколоночная карточка вопроса
   ============================================================ */
/* Overlap fix: главный хедер sticky z-index:30, шапка теста была z-index:5
   с почти тем же top — она уезжала ПОД хедер. В режиме теста хедер
   скрывается, а тулбар поднимается выше по слою. */
.toolbar{position:sticky;top:10px;z-index:32;margin-bottom:16px}
.toolbar .glass{padding:12px 16px;border-radius:18px}

/* На экране теста брендовый блок (логотип SAVT, «63 шаблона · 1255 вопросов»,
   статус «офлайн», переключатель RU/UZ) — дублирующий хедер. Остаётся только
   рабочая панель управления шаблоном. Действует на всех размерах, включая
   десктоп >=1024px и мобильные <768px. */
body.exam-mode header#topdock{display:none}

/* кнопка возврата в полноэкранный режим: иконка [ ] из уголков, без эмодзи */
.ebtn-fs{flex:0 0 auto;padding:9px 12px;line-height:0}
.ic-fs{position:relative;display:inline-block;width:14px;height:14px;vertical-align:middle}
.ic-fs::before,.ic-fs::after{content:'';position:absolute;width:5px;height:5px;border:2px solid currentColor}
.ic-fs::before{top:0;left:0;border-right:0;border-bottom:0}
.ic-fs::after{right:0;bottom:0;border-left:0;border-top:0}
/* в полноэкранном режиме кнопка не нужна */
body.fs-on .ebtn-fs{display:none}

/* один ряд, без переносов */
.exambar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-width:0}
.exspacer{flex:1 1 auto;min-width:4px}
.extitle{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.excounter{white-space:nowrap;font-size:13px}
.ebtn-back .ic-back{display:none}

/* ---- двухколоночная карточка ---- */
.qcard{padding:26px}
.qmain{min-width:0}
.qnav{margin-top:18px}
/* МОБИЛЬНЫЙ ПОРЯДОК (<768px), строго сверху вниз:
   1) «Вопрос X из Y» + текст вопроса, 2) изображение, 3) варианты ответов,
   4) кнопки «Назад»/«Далее».
   .qmain — обёртка левой колонки; на мобильных распускаем её через
   display:contents, чтобы её дети стали флекс-элементами карточки и
   картинку (.qaside) можно было вклинить между текстом и ответами. */
@media(max-width:767px){
  .qcard.split{display:flex;flex-direction:column}
  .qcard.split .qmain{display:contents}
  .qcard.split .qnum{order:1}
  .qcard.split .qtext{order:2;margin-bottom:14px}
  .qcard.split .qaside{order:3;margin:0 0 16px}
  .qcard.split .qaside .qimg{margin:0}
  .qcard.split .answers{order:4}
  .qcard.split .expl{order:5}
  .qcard.split .qnav{order:6;margin-top:16px}
}
@media(min-width:768px){
  .qcard.split{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(340px,44%);
    gap:26px;align-items:stretch;
  }
  /* левая колонка: навигация прижата к низу, чтобы не висела пустота */
  .qcard.split .qmain{display:flex;flex-direction:column}
  .qcard.split .qmain .qnav{margin-top:auto;padding-top:18px}
  .qcard.split .qaside{display:flex;align-items:flex-start;min-width:0}
  .qcard.split .qaside .qimg{margin:0;width:100%}
  .qcard.split .qaside .qimg img{
    width:100%;max-height:min(58vh,560px);
    background:rgba(255,255,255,.04);
  }
  body.day .qcard.split .qaside .qimg img{background:rgba(0,0,0,.04)}
  @media(min-width:1500px){
    .qcard.split{grid-template-columns:minmax(0,1fr) minmax(440px,48%)}
    .qcard.split .qaside .qimg img{max-height:min(64vh,680px)}
  }
}
/* ============================================================
   МОБИЛЬНАЯ ШАПКА ТЕСТА (<768px): fixed, прозрачная, неподвижная
   ============================================================ */
@media(max-width:767px){
  /* высота шапки меряется в JS (setExamHeaderVar) — контент под неё отступает */
  body.exam-mode{--exhdr-h:64px}
  body.exam-mode .toolbar{
    position:fixed;top:0;left:0;right:0;z-index:100;
    margin:0;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;
    background:transparent;border:0;box-shadow:none;
  }
  /* мягкая подложка-градиент: сама шапка прозрачна, но текст под ней
     не сливается с контентом при скролле */
  body.exam-mode .toolbar::before{
    content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,var(--bg) 38%,rgba(0,0,0,0) 100%);
  }
  /* стеклянная плашка внутри убирается — фон именно прозрачный */
  body.exam-mode .toolbar .glass{
    background:transparent;border:0;box-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    padding:0;border-radius:0;
  }
  /* один ряд, ничего не наезжает и не переносится */
  body.exam-mode .exambar{flex-wrap:nowrap;overflow:hidden;gap:7px;min-width:0}
  body.exam-mode .progressbar{margin-top:7px}
  /* отступ сверху ровно на высоту шапки, чтобы контент не перекрывался */
  body.exam-mode #app{padding-top:var(--exhdr-h)}
}

.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;padding:7px 15px;border-radius:999px;background:var(--glass2);border:1px solid var(--stroke)}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.progressbar{height:5px;background:rgba(128,128,128,.22);border-radius:99px;overflow:hidden;margin-top:11px}
.progressbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#4285f4,#34a853);transition:width .35s ease}
.qcard{padding:26px}
.qnum{color:var(--muted);font-size:13px;margin-bottom:10px;font-weight:500}
.qtext{font-size:18px;font-weight:650;margin-bottom:18px;line-height:1.5;letter-spacing:-.01em}
.qimg{margin:14px auto;text-align:center}
.qimg img{max-width:100%;width:auto;max-height:400px;object-fit:contain;border-radius:14px;border:1px solid var(--stroke);cursor:zoom-in;transition:transform .2s ease;background:rgba(0,0,0,.12)}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{
  padding:14px 16px;border-radius:16px;border:1px solid var(--stroke);
  font-size:15px;
  background:var(--glass2);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  cursor:pointer;line-height:1.5;display:flex;gap:12px;align-items:flex-start;
  transition:transform .15s ease, border-color .15s ease, background .15s ease;user-select:none;
}
.ans:hover:not(.locked){border-color:var(--accent);transform:translateX(3px)}
.ans:active:not(.locked){transform:scale(.99)}
.ans .letter{width:26px;height:26px;border-radius:8px;background:rgba(128,128,128,.22);display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 26px;line-height:1}
.ans.sel{border-color:var(--accent);background:rgba(138,180,248,.16)}
body.day .ans.sel{background:rgba(10,132,255,.14)}
.ans.sel .letter{background:var(--accent);color:#fff}
.ans.ok{border-color:var(--good);background:rgba(52,199,89,.16)}
.ans.ok .letter{background:linear-gradient(145deg,#28a745,#34c759);color:#fff}
.ans.no{border-color:var(--bad);background:rgba(255,69,58,.14)}
.ans.no .letter{background:linear-gradient(145deg,#d33426,#ff453a);color:#fff}
.ans.locked{cursor:default}
.expl{margin-top:14px;padding:14px 16px;border-radius:0 14px 14px 0;border-left:3px solid var(--accent);background:var(--glass2);color:var(--muted);font-size:14px}
.expl b{color:var(--text)}

/* dots: single stable row, yellow current */
.dots{display:flex;flex-wrap:nowrap;justify-content:center;gap:6px;margin-top:18px}
.dots .d{
  width:33px;height:33px;flex:0 0 33px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:13px;line-height:1;padding:0;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  background:var(--glass2);border:1px solid var(--stroke);color:var(--muted);
  font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);
}
.dots .d:hover{transform:scale(1.12)}
.dots .d.cur{background:var(--gyellow);border-color:transparent;color:#1c1c1e;box-shadow:0 4px 14px rgba(251,188,5,.45)}
/* статус ответа: жёлтый = не отвечен, зелёный = верно, красный = неверно */
.dots .d.pend:not(.cur){border-color:rgba(253,209,99,.75);color:var(--warn)}
.dots .d.ok{border-color:rgba(129,201,149,.85);color:var(--good);background:rgba(129,201,149,.14)}
.dots .d.no{border-color:rgba(242,139,130,.85);color:var(--bad);background:rgba(242,139,130,.14)}
.dots .d.ok.cur{background:var(--good);border-color:transparent;color:#1c1c1e;box-shadow:0 4px 14px rgba(129,201,149,.45)}
.dots .d.no.cur{background:var(--bad);border-color:transparent;color:#1c1c1e;box-shadow:0 4px 14px rgba(242,139,130,.45)}
.dots .d.pend.cur{background:var(--gyellow);border-color:transparent;color:#1c1c1e;box-shadow:0 4px 14px rgba(251,188,5,.45)}
/* ---- нижняя панель навигации по вопросам: во всю ширину экрана ----
   Показывается в режиме теста и на ПК, и на мобильных. */
.bottombar{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:34;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--glass);
  backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);
  border-top:1px solid var(--stroke);
  box-shadow:0 -10px 34px rgba(0,0,0,.28);
}
/* Нижняя пагинация 1..20 — ТОЛЬКО десктоп/планшет. На мобильных (<768px)
   она удалена из интерфейса: место экономится под контент. */
@media(min-width:768px){ body.exam-mode .bottombar.on{display:block} }
@media(max-width:767px){ .bottombar, body.exam-mode .bottombar.on{display:none !important} }
.bottombar .dots{
  margin:0;justify-content:center;flex-wrap:nowrap;
  overflow-x:auto;padding:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.bottombar .dots::-webkit-scrollbar{display:none}
.bottombar .dots .d{flex:0 0 36px;width:36px;height:36px;font-size:13px}
/* активный вопрос — чёткая жёлтая индикация */
.bottombar .dots .d.cur{
  transform:scale(1.12);
  box-shadow:0 4px 16px rgba(251,188,5,.55), 0 0 0 2px rgba(251,188,5,.28);
}
/* десктопный ряд точек под карточкой больше не нужен — навигация снизу */
#dots{display:none}
/* запас снизу под фиксированную панель навигации (есть только на >=768px) */
@media(min-width:768px){
  body.exam-mode #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}

/* result */
.result{padding:34px;text-align:center}
.score{font-size:56px;font-weight:800;letter-spacing:-.04em;margin:8px 0}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.bigok{color:var(--good)} .bigbad{color:var(--bad)}
.review{margin-top:18px;display:flex;flex-direction:column;gap:14px;text-align:left}

/* stats infographics */
.ring{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  background:conic-gradient(#34c759 var(--pct), #ff453a 0)}
.ring .hole{width:150px;height:150px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;transition:background .4s ease}
.ring .hole .big{font-size:36px;font-weight:800;letter-spacing:-.03em}
.trows{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.trow{display:grid;grid-template-columns:70px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.trow .bar{height:10px;border-radius:99px;background:rgba(128,128,128,.2);overflow:hidden}
.trow .bar>div{height:100%;border-radius:99px;transition:width .5s ease}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(255,149,0,.14);border:1px solid rgba(255,149,0,.4);color:#ff9f0a;font-weight:700;font-size:13px}
body.day .streak{color:#c93400}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:6px;padding:14px 16px;border-radius:16px;background:var(--glass2);border:1px solid var(--stroke);min-width:96px}
.badge .bi{font-size:24px}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge .bl{font-size:11px;color:var(--muted);text-align:center;font-weight:600}

/* pause & resume */
/* иконку паузы рисуем на CSS: глиф ⏸ (U+23F8) есть не во всех шрифтах и
   на части систем показывается пустым квадратом */
.pauseglyph{
  display:inline-block;position:relative;
  width:9px;height:11px;flex:0 0 9px;vertical-align:-1px;
}
.pauseglyph::before,.pauseglyph::after{
  content:'';position:absolute;top:0;width:3px;height:11px;
  border-radius:1.5px;background:currentColor;
}
.pauseglyph::before{left:0}
.pauseglyph::after{right:0}
.btn.pausebtn{
  background:rgba(253,214,99,.16);border-color:rgba(253,214,99,.42);color:var(--warn);
}
.btn.pausebtn:hover{background:rgba(253,214,99,.26);border-color:rgba(253,214,99,.65)}
.btn.hasresume{border-color:rgba(253,214,99,.55)}
.pausedot{color:var(--warn);display:inline-flex;align-items:center}
.resume h4{margin:0;font-size:17px;display:flex;align-items:center;gap:9px}
.resume h4 .pauseglyph{color:var(--warn);width:11px;height:13px}
.resume h4 .pauseglyph::before,.resume h4 .pauseglyph::after{height:13px;width:3.5px}
.resume{border-color:rgba(253,214,99,.4);background:linear-gradient(180deg,rgba(253,214,99,.09),transparent 70%),var(--glass)}
.resume .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.resume .warnline{color:var(--warn)}

/* toast */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,26px);
  z-index:80;max-width:calc(100vw - 32px);
  padding:13px 22px;border-radius:999px;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 16px 40px rgba(0,0,0,.4);
  color:var(--text);font-weight:600;font-size:14px;text-align:center;
  opacity:0;transition:opacity .3s ease, transform .3s cubic-bezier(.3,1,.3,1);
  pointer-events:none;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* modal / lightbox */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);z-index:60;display:grid;place-items:center;padding:20px}
.modal{max-width:420px;width:100%;padding:26px;text-align:center}
.modal p{margin:6px 0 18px;color:var(--muted)}
.modal b{font-size:17px}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:18px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 30px 90px rgba(0,0,0,.6)}

.muted{color:var(--muted)}
.empty{padding:44px;text-align:center;color:var(--muted)}
footer{margin-top:36px;text-align:center;color:var(--muted2);font-size:12.5px;letter-spacing:.06em;direction:ltr}
h2.sec{font-size:13px;margin:24px 0 12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}

/* mobile */
@media(max-width:640px){
  #app{padding:18px 14px calc(130px + env(safe-area-inset-bottom))}
  body.exam-mode #app{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  header{margin-bottom:20px}
  h1{font-size:18px}
  .sub{font-size:11.5px}
  .qcard{padding:16px}
  .qimg img{max-height:230px}

  /* ---- ЭКРАН ТЕСТА НА МОБИЛЬНЫХ ----
     1) главный хедер полностью скрыт — он занимал место и наезжал на шапку теста */
  body.exam-mode header{display:none}
  body.exam-mode #app{padding-left:10px;padding-right:10px}
  /* 2) шапка теста — fixed/прозрачная, правила выше в блоке <=767px */
  .toolbar .glass{padding:9px 10px;border-radius:15px}
  /* 3) один ровный ряд без срезов: длинные подписи прячем, оставляем иконки */
  .exambar{gap:7px}
  .ebtn-back .ic-back{display:inline;font-size:16px;line-height:1}
  .ebtn-back .lbl{display:none}
  .ebtn-back{padding:9px 12px;flex:0 0 auto}
  .extitle{font-size:13.5px;flex:0 1 auto}
  .excounter{display:none}
  .timer{font-size:13.5px;padding:6px 10px;flex:0 0 auto}
  .ebtn-fin{padding:9px 13px;font-size:13px;flex:0 0 auto}
  .progressbar{margin-top:8px}
  .score{font-size:44px}
  /* нижняя пагинация на мобильных удалена (правило в блоке <=767px) */
  .btn{padding:11px 15px;font-size:13.5px}
  .timer{font-size:14px;padding:6px 11px}
  .chip{display:none}
  .btn.pausebtn .lbl{display:none}
  .btn.pausebtn{padding:11px 13px}
  .btn.pausebtn .pauseglyph{width:11px;height:13px}
  .btn.pausebtn .pauseglyph::before,.btn.pausebtn .pauseglyph::after{height:13px}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom));font-size:13.5px;padding:12px 18px}
  .resume .row.spread{flex-direction:column;align-items:stretch;gap:12px}
  .resume .row.spread .row{justify-content:stretch}
  .resume .row.spread .row .btn{flex:1}
  .node .cardwrap{width:88%}
  .sidemenu{width:270px}

  /* ---- производительность на мобильных ----
     Несколько полноэкранных backdrop-filter + blur(70px) на слабых GPU
     дают просадку при скролле. Уменьшаем радиусы и убираем лишние слои. */
  header{top:8px;padding:9px 11px;border-radius:18px;gap:11px}
  .headmeta .sub{display:none}
  .offline-pill{padding:3px 8px;font-size:10px}
  #aurora .beam{filter:blur(48px);opacity:.42}
  #dotgrid{background-size:22px 22px;opacity:.4}
  /* кнопки режимов: строго один ряд, ужимаем всё чтобы влезли все 4 */
  .modedock{width:100%;justify-content:space-between;gap:1px;padding:3px;border-radius:15px}
  .modebtn{padding:8px 7px;font-size:11.5px;gap:4px;border-radius:12px}
  .modebtn .mi{font-size:12.5px}
  .modebtn .cnt{font-size:9.5px;padding:1px 4px;border-radius:99px}
  .node .body{padding:12px 14px}
  .node .nm{font-size:14px}
  .node .meta{font-size:11px}
  .node .dot{width:40px;height:40px;flex:0 0 40px;font-size:14px}
  /* halo и border-beam — только на десктопе */
  .node.done .dot::after,.node.current .dot::after{animation:none;opacity:0}
  .node.perfect .body::before{animation-duration:7s}

  /* ГЛАВНОЕ для FPS: 63 карточки × backdrop-filter = 63 слоя размытия,
     которые пересчитываются на каждом кадре скролла. На мобильных
     заменяем размытие на плотную заливку — на фоне ауроры разница
     почти незаметна, а скролл перестаёт дёргаться. */
  .node .body,
  .node .dot,
  .chip, .pctbadge, .dots .d{
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
  }
  .node .body{background:rgba(22,26,34,.82)}
  body.day .node .body{background:rgba(255,255,255,.86)}
  /* заливку подменяем только у нейтральных узлов: у .done/.fail/.current
     свой градиент, перекрывать его нельзя — иначе пропадают галочки */
  .node:not(.done):not(.fail) .dot{background:rgba(30,34,44,.9)}
  body.day .node:not(.done):not(.fail) .dot{background:rgba(255,255,255,.9)}
  /* аурора: меньше слоёв и радиус — дешевле композитинг */
  #aurora .b3{display:none}
}

/* очень узкие экраны (<=360px): у кнопок режимов остаются иконки и счётчики,
   подпись прячем — так все 4 кнопки гарантированно в одной строке */
@media(max-width:640px){
  /* на мобильных — короткие подписи вместо полных, чтобы все 4 кнопки
     влезали в один ряд и при этом оставались понятными */
  .modebtn .mlbl{display:none}
  .modebtn .mshort{display:inline}
  .modebtn{padding:8px 7px;font-size:10.5px;gap:3px;letter-spacing:-.01em}
  .modebtn .mi{font-size:11.5px}
  .modebtn .cnt{font-size:9px;padding:1px 4px;margin-left:1px}
  #resetAll{font-size:10.5px;padding:8px 7px}
}

/* слабые устройства: полностью отключаем дорогие эффекты фона */
@media (max-width:640px) and (prefers-reduced-motion: reduce){
  #aurora .beam{animation:none}
}

/* ---------- AI MODAL ---------- */
.ai-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.ai-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}
.ai-modal-content {
  position: relative;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  background: var(--glass);
  border: 1px solid var(--stroke);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.ai-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--stroke);
  font-weight: 600;
  font-size: 15px;
}
.ai-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
  border-radius: 8px;
  transition: background 0.2s, color 0.2s;
}
.ai-close:hover { background: var(--glass2); color: var(--text); }
.ai-context {
  padding: 12px 16px;
  border-bottom: 1px solid var(--stroke);
  background: var(--glass2);
  font-size: 13px;
  line-height: 1.6;
  max-height: 200px;
  overflow-y: auto;
}
.ai-context div { margin: 4px 0; }
.ai-context b { color: var(--text); }
.ai-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.ai-message {
  padding: 12px 14px;
  border-radius: 14px;
  line-height: 1.55;
  font-size: 14px;
  white-space: pre-wrap;
  word-wrap: break-word;
  max-width: 90%;
}
.ai-message.user {
  align-self: flex-end;
  background: var(--accent);
  color: #0b0d12;
  border-bottom-right-radius: 4px;
}
.ai-message.assistant {
  align-self: flex-start;
  background: var(--glass2);
  border: 1px solid var(--stroke);
  border-bottom-left-radius: 4px;
}
.ai-input-wrap {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid var(--stroke);
}
.ai-input-wrap input {
  flex: 1;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--stroke);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.ai-input-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(138,180,248,0.2); }
.ai-input-wrap input:disabled { opacity: 0.6; }
.ai-input-wrap .btn { flex-shrink: 0; }
.ai-hint {
  padding: 0 16px 14px;
  font-size: 11px;
  color: var(--muted2);
  line-height: 1.4;
}
.ai-btn {
  background: linear-gradient(135deg, var(--accent), var(--accent2)) !important;
  color: #0b0d12 !important;
  font-weight: 600;
}
.ai-btn:hover { filter: brightness(1.1); }

/* Плавающая кнопка ИИ-помощника на главной (FAB, справа внизу) */
.ai-fab{
  position:fixed;
  right:24px;
  bottom:24px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  font-size:26px;
  line-height:1;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 28px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.18);
  z-index:35;
  transition:transform .2s ease, box-shadow .2s ease;
}
.ai-fab:hover{ transform:scale(1.08); box-shadow:0 10px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.22); }
.ai-fab:active{ transform:scale(.94); }

/* ---------- INLINE ICONS (Material Line style) ---------- */
.ico{ width:1.15em; height:1.15em; display:inline-block; vertical-align:-0.18em; }
.ico svg{ width:100%; height:100%; display:block; }
/* класс hidden не должен пробиваться через display:flex у .mitem / .offline-pill */
.mitem[hidden], .offline-pill[hidden]{ display:none !important; }

/* иконка в боковом меню: лёгкое увеличение и свечение при ховере */
.sidemenu .mitem .ic .ico{ transition:transform .18s ease, filter .18s ease; }
.sidemenu .mitem:hover .ico{ transform:scale(1.12); filter:drop-shadow(0 0 6px rgba(138,180,248,.65)); }
body.day .sidemenu .mitem:hover .ico{ filter:drop-shadow(0 0 5px rgba(10,132,255,.45)); }

/* иконки в доке режимов: медленное мягкое «плавание» вверх-вниз */
@keyframes icoFloat{
  from{ transform:translateY(-1px); }
  to{ transform:translateY(1px); }
}
.modebtn:not(:disabled) .ico{ animation:icoFloat 3s ease-in-out infinite alternate; }

/* пульсирующее кольцо вокруг FAB ИИ-помощника */
.ai-fab::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:2px solid var(--accent);
  animation:fabRing 2.6s ease-out infinite;pointer-events:none;
}
@keyframes fabRing{
  0%{ transform:scale(1); opacity:.65; }
  70%,100%{ transform:scale(1.5); opacity:0; }
}

@media (prefers-reduced-motion: reduce){
  .modebtn .ico{ animation:none; }
  .ai-fab::after{ animation:none; opacity:0; }
}

/* чип email в хедере рядом с «офлайн» */
.offline-pill.authpill{
  background:rgba(138,180,248,.14);
  border-color:rgba(138,180,248,.4);
  color:var(--accent);
  max-width:160px;overflow:hidden;text-overflow:ellipsis;
}

/* ---------- AUTH MODAL (glass, в стиле .ai-modal) ---------- */
.auth-content{ max-width:380px; }
.auth-tabs{ display:flex; gap:6px; padding:12px 16px 0; }
.auth-tab{
  flex:1; padding:10px; border-radius:12px;
  border:1px solid var(--stroke); background:transparent;
  color:var(--muted); font-weight:600; font-size:13.5px;
  cursor:pointer; font-family:inherit; transition:.2s;
}
.auth-tab.on{ background:var(--glass2); color:var(--text); border-color:var(--stroke2); }
.auth-tab:hover:not(.on){ color:var(--text); }
.auth-form{ display:flex; flex-direction:column; gap:10px; padding:14px 16px 16px; }
.auth-form input{
  padding:12px 14px; border-radius:12px;
  border:1px solid var(--stroke); background:var(--bg);
  color:var(--text); font-size:14px; outline:none; font-family:inherit;
  transition:border-color .2s, box-shadow .2s;
}
.auth-form input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(138,180,248,.2); }
.auth-pass{ position:relative; }
.auth-pass input{ width:100%; padding-right:46px; }
.auth-eye{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; display:grid; place-items:center;
  background:none; border:none; color:var(--muted); cursor:pointer;
  border-radius:8px; padding:0;
}
.auth-eye:hover{ color:var(--text); background:var(--glass2); }
.auth-err{ color:var(--bad); font-size:12.5px; min-height:18px; }
.auth-account{ padding:16px; display:flex; flex-direction:column; gap:10px; }
.auth-email{ font-weight:700; font-size:15px; word-break:break-all; }
.auth-account .btn.big{ width:100%; }

@media (max-width: 640px) {
  .ai-modal { padding: 0; align-items: flex-end; }
  .ai-modal-content {
    max-height: 100vh;
    border-radius: 20px 20px 0 0;
    height: 85vh;
  }
  .ai-messages { padding: 12px; }
  .ai-message { max-width: 85%; font-size: 13px; }
  .ai-input-wrap { padding: 10px 12px; }
  .ai-input-wrap input { padding: 14px 12px; }
  .ai-fab { right:14px; bottom:14px; width:52px; height:52px; font-size:23px; }
}

/* ---------- SPLASH SCREEN (заставка при загрузке) ---------- */
#splash{
  position:fixed;inset:0;z-index:2000;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:var(--bg);
  transition:opacity .45s ease;
}
#splash.gone{opacity:0}
.splash-logo{
  width:96px;height:96px;border-radius:24px;object-fit:cover;
  box-shadow:0 18px 50px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
  animation:splashIn .7s ease-out both;
}
.splash-title{font-size:34px;font-weight:800;letter-spacing:.22em;margin-left:.22em;color:var(--text)}
#splash .splash-title span{display:inline-block;animation:splashRise .5s ease-out both}
#splash .splash-title span:nth-child(1){animation-delay:.1s}
#splash .splash-title span:nth-child(2){animation-delay:.16s}
#splash .splash-title span:nth-child(3){animation-delay:.22s}
#splash .splash-title span:nth-child(4){animation-delay:.28s}
.splash-bar{width:180px;height:3px;border-radius:99px;background:var(--glass2);border:1px solid var(--stroke);overflow:hidden}
.splash-bar i{display:block;height:100%;width:45%;border-radius:99px;background:linear-gradient(90deg,#4285f4,#34c759);animation:splashShimmer 1.15s ease-in-out infinite}
@keyframes splashIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes splashRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashShimmer{from{transform:translateX(-110%)}to{transform:translateX(240%)}}
@media (prefers-reduced-motion: reduce){
  .splash-logo,#splash .splash-title span,.splash-bar i{animation:none}
}

/* ---------- AUTH PAGE (полноэкранная, вместо модалки для гостей) ---------- */
.authpage{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:12px 0}
.auth-head{display:flex;flex-direction:column;align-items:center;gap:10px}
.splash-logo.sm{width:64px;height:64px;border-radius:16px;animation:none;box-shadow:0 10px 28px rgba(10,132,255,.3)}
.splash-title.sm{font-size:22px;letter-spacing:.18em;margin-left:.18em}
.authpage .splash-tagline{margin-top:-4px}
.authcard{width:100%;max-width:420px;padding:20px}
.auth-cardtitle{font-weight:700;font-size:16px;text-align:center;margin-bottom:4px}
.auth-locked{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 14px;border-radius:12px;border:1px dashed var(--stroke);
  background:var(--glass2);color:var(--muted);font-weight:600;font-size:13.5px;word-break:break-all;
}
.auth-hint{color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
.auth-skip{
  background:none;border:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;padding:4px 10px;border-radius:8px;transition:color .2s;
}
.auth-skip:hover{color:var(--text)}
@media(max-width:640px){
  .authpage{gap:14px;padding:4px 0}
  .authcard{padding:16px 14px;border-radius:18px}
}


/* PERF-мобильный: фиксированные панели без дорогих блюров,
   вечные анимации выключены, roadmap рендерится лениво */
@media (max-width:640px){
  .glass{ backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .bottombar{ backdrop-filter:none!important; -webkit-backdrop-filter:none!important;
    background:rgba(18,21,28,.93); }
  body.day .bottombar{ background:rgba(255,255,255,.95); }
  .sidemenu{ backdrop-filter:none!important; background:rgba(16,19,26,.97); }
  body.day .sidemenu{ background:rgba(255,255,255,.98); }
  .toast{ backdrop-filter:none!important; background:rgba(24,28,36,.96); }
  .ai-fab::after{ display:none; }
  h2.sec .ico{ margin-right:9px; }
  .modebtn .ico{ animation:none; }
}
/* content-visibility: 63 карточки рендерятся только когда видны */
.node{ content-visibility:auto; contain-intrinsic-size: auto 104px; }
@media (prefers-reduced-motion: reduce){
  .node{ content-visibility:visible; }
}

/* ---------- Карточка ИИ-анализа на главной ---------- */
.aacard{padding:16px 18px;margin-bottom:20px}
.aacard-head{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px}
.aacard-head .ico{width:1.2em;height:1.2em;flex:0 0 auto}
.aa-spacer{flex:1}
.aacard-refresh{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px;border-radius:9px;display:flex;align-items:center}
.aacard-refresh:hover{color:var(--text);background:var(--glass2)}
.aacard-refresh .ico{width:1.1em;height:1.1em}
.aacard-body{margin-top:10px;font-size:14px;line-height:1.55}
.aacard-hint{color:var(--muted);font-size:13px;margin-top:6px}
.aa-loading{color:var(--muted);animation:aaPulse 1.4s ease-in-out infinite;display:inline-block}
@keyframes aaPulse{50%{opacity:.45}}
.aa-headline{margin-bottom:10px}
.aa-sec{margin:8px 0}
.aa-sec b{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);margin-bottom:4px}
.aa-sec b .ico{width:1.1em;height:1.1em}
.aa-sec ul{margin:0;padding-left:18px}
.aa-sec li{margin:3px 0}
.aa-when{color:var(--muted2);font-size:11px;margin-top:8px}
#aaTrain{margin-top:12px}
@media (prefers-reduced-motion: reduce){
  .aa-loading{animation:none}
}
