name = "savt-ai"
main = "src/index.ts"
compatibility_date = "2024-11-10"
compatibility_flags = ["nodejs_compat"]

[vars]
# NVIDIA NGC API (build.nvidia.com)
AI_BASE_URL = "https://integrate.api.nvidia.com/v1"
AI_MODEL = "nvidia/nemotron-3.5-super-vl-120b-a12b"
ALLOWED_ORIGIN = "https://sulaymonov1s-ai.github.io"

# Хранилище аккаунтов и прогресса (регистрация/логин/синхронизация)
[[kv_namespaces]]
binding = "PROGRESS"
id = "d3ec2c14eb65463fa13e62cb42232dde"
